name: Gerar capas sociais JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-covers.yml'
      - 'scripts/generate_social_covers.py'
      - 'covers/podcasts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Gerar imagens 1200x630
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de imagens
        run: python -m pip install 'Pillow>=11.3,<13'
      - name: Converter capas de episódios
        run: python scripts/generate_social_covers.py
      - name: Publicar imagens geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A covers/social
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): atualizar capas JPEG para previews [skip ci]"
            git push origin HEAD:main
          else
            echo "Capas sociais já atualizadas."
          fi
