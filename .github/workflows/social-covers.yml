name: Gerar capas sociais JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-covers.yml'
      - 'scripts/generate_social_covers.py'
      - 'covers/podcasts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Gerar imagens 1200x630
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar biblioteca de imagens
        run: python -m pip install 'Pillow>=11.3,<13'
      - name: Converter capas de episódios
        run: python scripts/generate_social_covers.py
      - name: Publicar imagens geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A covers/social
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): atualizar capas JPEG para previews [skip ci]"
            git push origin HEAD:main
          else
            echo "Capas sociais já atualizadas."
          fi
