name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    name: Testes e validação de sintaxe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
